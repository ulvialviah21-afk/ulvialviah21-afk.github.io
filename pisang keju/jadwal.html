<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisang Keju Vay - Jadwal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #3b2415;

            background:
                linear-gradient(135deg, #fff4c7 25%, transparent 25%) -20px 0,
                linear-gradient(225deg, #fff4c7 25%, transparent 25%) -20px 0,
                linear-gradient(315deg, #fff4c7 25%, transparent 25%),
                linear-gradient(45deg, #fff4c7 25%, #fffaf0 25%);

            background-size: 80px 80px;
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: auto;
            text-align: center;
        }

        .logo {
            width: 230px;
            margin-top: 25px;
            border-radius: 50%;
        }

        nav {
            margin: 15px 0 50px;
            font-size: 20px;
        }

        nav a {
            color: #7b3f00;
            font-weight: bold;
            margin: 0 8px;
        }

        hr {
            border: none;
            border-top: 1px solid #9b7a55;
        }

        h1 {
            text-align: left;
            font-size: 38px;
            margin-top: 50px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 35px;
            background: rgba(255, 255, 255, 0.8);
            font-size: 19px;
        }

        th, td {
            border: 1px solid #5d4037;
            padding: 18px;
            text-align: left;
        }

        th {
            font-size: 21px;
            background: #ffe082;
        }

        .catatan {
            font-style: italic;
            font-size: 18px;
            text-align: left;
            margin-top: 20px;
        }

        footer {
            margin: 70px 0 30px;
            color: #795548;
        }

</head>

<div class="container">

    <!-- LOGO -->
    <img src="logo.jpg" class="logo" alt="Logo Pisang Keju Vay">

    <!-- MENU -->
    <nav>
        <a href="index.html">Beranda</a> |
        <a href="jadwal.html">Jadwal</a>
    </nav>

    <table>

        <tr>
            <th>Hari</th>
            <th>Jam Buka</th>
        </tr>

        <tr>
            <td>Senin - Jumat</td>
            <td>09.00 - 21.00</td>
        </tr>

        <tr>
            <td>Sabtu</td>
            <td>09.00 - 22.00</td>
        </tr>

        <tr>
